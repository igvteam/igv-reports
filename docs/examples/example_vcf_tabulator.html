    <!-- Tabulator -->

    <!-- igv -->
    <script src="https://cdn.jsdelivr.net/npm/igv@3.5.2/dist/igv.min.js"></script>

    <style type="text/css">
        body {
            font-size: 80%;
            font-family: 'Lucida Grande', Verdana, Arial, Sans-Serif;
        }


    </style>

    <!-- selector table style -->
    <style>

        thead {
            position: sticky;
            top: 0;
        }

        tr {
            cursor: default;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: lightblue;
        }

        th {
            background-color: lightskyblue;
            color: white;
            cursor: pointer;
        }

        .selected {
            background-color: lightblue !important;
            outline: solid thin darkblue !important;
        }
    </style>

    <!-- accordian style,  ref: https://alligator.io/css/collapsible/ -->
    <style type="text/css">
        .wrap-collabsible {
            margin-bottom: 1.2rem;
        }

        input[type='checkbox'] {
            display: none;
        }

        .lbl-toggle {
            display: block;

            font-weight: bold;
            font-family: monospace;
            font-size: 1.2rem;
            text-transform: uppercase;
            text-align: left;

            padding: 1rem;

            color: black;
            background: #dddddd;

            cursor: pointer;

            border-radius: 7px;
            transition: all 0.25s ease-out;
        }

        .lbl-toggle:hover {
            color: blue;
        }

        .lbl-toggle::before {
            content: ' ';
            display: inline-block;

            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 5px solid currentColor;
            vertical-align: middle;
            margin-right: .7rem;
            transform: translateY(-2px);

            transition: transform .2s ease-out;
        }

        .toggle:checked + .lbl-toggle::before {
            transform: rotate(90deg) translateX(-3px);
        }

        .collapsible-content {
            max-height: 0px;
            overflow: auto;
            transition: max-height .25s ease-in-out;
        }

        .toggle:checked + .lbl-toggle + .collapsible-content {
            max-height: 350px;
        }

        .toggle:checked + .lbl-toggle {
            border-bottom-right-radius: 0;
            border-bottom-left-radius: 0;
        }

        .collapsible-content .content-inner {
            background: rgba(250, 224, 66, .2);
            border-bottom: 1px solid rgba(250, 224, 66, .45);
            border-bottom-left-radius: 7px;
            border-bottom-right-radius: 7px;
            padding: .5rem 1rem;
        }
    </style>

</head>

    const filterConfig = {"columns": {"GENE": {"type": "string", "filter": "contains", "label": "Gene Name", "case_sensitive": false}, "TISSUE": {"type": "string", "filter": "list", "label": "Tissue Type", "headerFilter": "list", "headerFilterParams": {"valuesLookup": true, "clearable": true}}, "TUMOR": {"type": "string", "filter": "exact", "label": "Tumor"}, "COSMIC_ID": {"type": "string", "filter": "contains", "label": "COSMIC ID", "formatter": "html"}, "SOMATIC": {"type": "string", "filter": "exact", "label": "Somatic"}, "reads_1_fastq:DP": {"type": "number", "filter": "range", "label": "Depth", "min": 0, "max": 1000}, "reads_1_fastq:GQ": {"type": "number", "filter": "threshold", "label": "Genotype Quality", "threshold": 30}}}
    let igvBrowser
    let table

    document.addEventListener("DOMContentLoaded", function () {
        initIGV()
    })

    function initIGV() {
        const igvDiv = document.getElementById("igvDiv")
        const options = {
            sessionURL: sessionDictionary["0"],
            showChromosomeWidget: false,
            showCenterGuide: true,
            search: false
        }

        igv.createBrowser(igvDiv, options)
            .then(function (b) {
                igvBrowser = b
                initTable()
            })
    }

    function initTable() {
        // Create columns for all headers except unique_id
        const columnConfig = tableJson.headers
            .filter(header => header !== "unique_id")
            .map(header => {
                // Get filter settings if they exist
                const settings = filterConfig?.columns?.[header] || {}
                
                return {
                    title: settings.label || header,
                    field: header,
                    sorter: settings.type === "number" ? "number" : "string",
                    headerFilter: settings.headerFilter || (settings.type === "number" ? "number" : "input"),
                    headerFilterPlaceholder: `Filter ${settings.label || header}`,
                    headerFilterParams: settings.headerFilterParams || {},
                    formatter: settings.formatter,
                    ...settings
                }
            })

        // Initialize Tabulator
        table = new Tabulator("#tableSelectorDiv", {
            data: tableJson.rows.map(row => {
                const obj = {}
                tableJson.headers.forEach((header, i) => {
                    obj[header] = row[i]
                })
                return obj
            }),
            columns: columnConfig,
            layout: "fitDataTable",
            pagination: true,
            paginationSize: 25,
            paginationSizeSelector: [10, 25, 50, 100],
        })

        // Add clear filters functionality
        document.getElementById("clearFilters").addEventListener("click", function() {
            table.clearFilter(true);
        });

        table.on("rowClick", function(e, row) {
                const uniqueId = row.getData()["unique_id"]
                const session = sessionDictionary[uniqueId]
                igvBrowser.loadSession({
                    url: session
                })
            })
    }
